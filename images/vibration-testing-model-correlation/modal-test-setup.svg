<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc"><title id="title">Controlled vibration testing of a cantilever plate</title><desc id="desc">A measured hammer or shaker force excites a cantilever plate. Accelerometers and the force transducer connect to synchronized data acquisition, then to frequency response and modal analysis.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#1F5C7A"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-4 14L14 -4M4 18L18 4" stroke="#A8B1B7" stroke-width="2"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#1C2430}.label{font-size:30px}.small{font-size:25px;fill:#5B6573}.heading{font-size:35px;font-weight:600}.line{fill:none;stroke:#1F5C7A;stroke-width:4;marker-end:url(#arrow)}</style><rect width="1600" height="900" fill="white"/><text x="65" y="78" class="small" letter-spacing="3">EXPERIMENTAL MODAL ANALYSIS · COURSE TEST CONCEPT</text>
<text x="65" y="138" class="heading">Measure the input. Record the response.</text>
<rect x="125" y="270" width="90" height="330" fill="url(#hatch)" stroke="#5B6573" stroke-width="3"/>
<path d="M215 330L800 270L900 510L215 555Z" fill="#EAF1F5" stroke="#1F5C7A" stroke-width="4"/>
<path d="M215 330V555" stroke="#1C2430" stroke-width="14"/>
<text x="85" y="650" class="label">Bolted boundary</text><path d="M180 610V580" stroke="#5B6573" stroke-width="2"/>
<text x="375" y="590" class="label">Cantilever plate</text>
<g fill="#1F5C7A" stroke="white" stroke-width="3"><circle cx="390" cy="395" r="13"/><circle cx="570" cy="370" r="13"/><circle cx="755" cy="435" r="13"/></g>
<text x="365" y="715" class="label">Accelerometers: a(t)</text><path d="M540 675L570 385" fill="none" stroke="#5B6573" stroke-width="2"/>
