<title id="title">Function Evaluations per Stress Condition</title>
<desc id="desc">For each of eleven stress conditions, the number of function evaluations needed for the local reliability benchmark. The proposed adaptive method needs between 4 and 18 runs per condition, 101 in total. Adaptive Kriging Monte Carlo simulation (AK-MCS) needs between 25 and 220, 674 in total. Values from Table 2 of Qian, Hu and Todd, MSSP 2023.</desc>
